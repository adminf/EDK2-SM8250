name: build-uefi-enuma

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build UEFI
        run: ./ci-build.sh

      - name: Upload boot_uefi.img
        uses: actions/upload-artifact@v4
        with:
          name: uefi-enuma
          path: boot_uefi.img
          if-no-files-found: warn
